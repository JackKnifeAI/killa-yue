name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: App logic regression tests
        run: bash app/test/run.sh
      - name: Android SDK pieces
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
      - name: Compile resources, Java and dex
        run: |
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar" \
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0" \
          app/check.sh

  licences:
    name: Nothing that must not be committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No native binaries, QNN files, keys or local settings
        run: |
          bad=$(git ls-files | grep -Ei '\.so(\.[0-9]+)*$|qnn|\.keystore$|\.jks$|(^|/)local\.env$|\.apk$' || true)
          if [ -n "$bad" ]; then echo "These must not be in the repository:"; echo "$bad"; exit 1; fi
          echo "Clean."

  hammer:
    name: HAMMER encrypted peers and native audio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and test native streaming, private catalogs and push
        run: bash peer/test/run.sh
      - name: Native descriptor and malformed-media sanitizer tests
        run: bash peer/test/native-safety.sh
      - name: Build downloadable desktop companion
        run: HAMMER_DESKTOP_LIB="$PWD/build-hammer-host/libhammer.so" bash peer/build-companion.sh "$PWD/out"
      - name: Build the pinned libp2p network
        run: bash net/build.sh host
      - name: Network discovery, DHT and relay regression tests
        run: bash peer/test/network.sh
      - uses: actions/upload-artifact@v4
        with:
          name: hammer-desktop-linux-x86_64-preview
          path: out/hammer-server.zip

  mobile:
    name: Mobile patch stack and context safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ServeurpersoCom/yue2.cpp
          ref: 83b65f5d6bf4806557ef17fe763021ff4eead928
          submodules: true
          path: build-mobile-source
      - name: Apply all patches to the pinned public engine
        run: bash engine/prepare-mobile-source.sh build-mobile-source
      - name: Context limits under address and undefined-behavior sanitizers
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-pie -no-pie -Ibuild-mobile-source/src engine/context-budget-test.cpp \
            -o /tmp/context-budget-test
          /tmp/context-budget-test
      - name: Helper syntax checks
        run: |
          bash -n engine/build-portable-android.sh engine/build-mobile-vulkan-test.sh
          python3 -m py_compile tools/check-android-runtime.py tools/android-length-test/*.py
