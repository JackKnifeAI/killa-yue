[package]
name = "killanet"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "The Killa YuE network node: rust-libp2p carrying HAMMER connections, peer to peer"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Exact versions: the network must build from this repository alone (see vendor/ and docs/designs/2026-10-18-worldwide-network.md).
libp2p = { version = "=0.57.1", default-features = false, features = ["tokio", "tcp", "quic", "noise", "yamux", "mdns", "identify", "ping", "macros", "ed25519", "kad", "autonat", "relay", "dcutr", "upnp"] }
libp2p-stream = "=0.5.0-alpha"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"
jni = "=0.21.1"
mainline = { version = "=8.0.1", default-features = false, features = ["node"] }
# the mixnet: Nym's Sphinx packet format (Apache-2.0), used as a library; the mix layer around it is ours (src/mix.rs)
sphinx-packet = "=0.8.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
rand = "=0.10.2"
sha2 = "=0.11.0"
# the seal on a delivery, so its last mix cannot read it: crates the lockfile already had through libp2p and Sphinx
curve25519-dalek = { version = "=5.0.0", default-features = false }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
hkdf = "=0.13.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
# unwind, so a panic becomes an error in Java instead of ending the app (see catch_unwind in the JNI calls)
panic = "unwind"

# libp2p-relay 0.22.0 with one fix (see patches/libp2p-relay/KILLA-PATCH.md): without it a relay switching on or off
# while it has a relayed connection panics and stops the node's network thread.
[patch.crates-io]
libp2p-relay = { path = "patches/libp2p-relay" }
