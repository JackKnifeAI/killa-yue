<!doctype html>
<html><head><meta charset="utf-8">
<script src="abcjs-basic-min.js"></script>
</head><body><div id="paper"></div>
<script>
// Lays a prepared score out with abcjs and hands the SVG to the app (Engrave.java). Any warning means
// abcjs did not understand part of the score, and the app reports it instead of printing a wrong sheet.
// tablature (or null) draws a tab under the staff; our abcjs is patched for re-entrant tunings (THIRD_PARTY_LICENSES.md).
function engrave(abc, staffwidth, tablature) {
  try {
    var options = { staffwidth: staffwidth, add_classes: true,
      paddingtop: 0, paddingbottom: 0, paddingleft: 0, paddingright: 4 }; // the closing bar line sits just past staffwidth
    if (tablature) options.tablature = tablature;
    var tunes = ABCJS.renderAbc("paper", abc, options);
    var warnings = (tunes[0] && tunes[0].warnings) || [];
    if (warnings.length) {
      Killa.fail(warnings.map(function (w) { return String(w).replace(/<[^>]+>/g, ""); }).join("\n"));
      return;
    }
    var svg = document.querySelector("#paper svg");
    if (!svg) { Killa.fail("abcjs drew nothing"); return; }
    Killa.starts(JSON.stringify(lineStarts(tunes[0])));
    Killa.svg(svg.outerHTML);
  } catch (e) {
    Killa.fail(String(e));
  }
}
// When each line of music starts, in ms, from abcjs's own playback timing: the earliest event drawn on it.
function lineStarts(tune) {
  var starts = {};
  new ABCJS.TimingCallbacks(tune, {}).noteTimings.forEach(function (ev) {
    (ev.elements || []).forEach(function (group) {
      (group || []).forEach(function (el) {
        var m = /abcjs-l(\d+)/.exec(el.getAttribute("class") || "");
        if (m && (starts[m[1]] === undefined || ev.milliseconds < starts[m[1]])) starts[m[1]] = Math.round(ev.milliseconds);
      });
    });
  });
  return starts;
}
</script></body></html>
