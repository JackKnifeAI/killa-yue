[package]
name = "killa-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false
description = "Local hardware and driver diagnostics for the Killa YuE desktop companion"

[dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std", "debug"] }
ctrlc = "=3.4.5"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.9"
sysinfo = { version = "=0.33.1", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "=0.2.172"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
